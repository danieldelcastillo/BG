[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "bg-futbol-simulator"
version = "0.1.0"
description = "Motor exacto y extensible para el sistema de partido de BG FÚTBOL."
requires-python = ">=3.11"
license = { text = "Proprietary" }

[project.scripts]
bg-futbol-sim = "bg_futbol_simulator.main:main"

[tool.setuptools]
packages = ["bg_futbol_simulator"]
